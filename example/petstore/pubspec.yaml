name: petstore
description: >-
  JPetStore — MyBatis 공식 샘플의 flutter_mybatis 이식판.
  순수 Dart 콘솔 앱이라 `dart run` 한 줄로 실행됩니다.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.5.0

dependencies:
