    path: ../../
  sqflite_common: ^2.5.0
  sqflite_common_ffi: ^2.4.0

dev_dependencies:
  build_runner: ^2.4.0
  flutter_mybatis_generator:
    path: ../../generator
  lints: ^5.0.0
  test: ^1.24.0
