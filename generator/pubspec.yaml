name: flutter_mybatis_generator
description: >-
  Code generator for flutter_mybatis. Generates Mapper implementations from
  annotated abstract classes, and validates statement ids against the mapper
  XML at build time.
version: 1.0.2

homepage: https://github.com/ryan-min/flutter_mybatis
repository: https://github.com/ryan-min/flutter_mybatis
issue_tracker: https://github.com/ryan-min/flutter_mybatis/issues

topics:
  - build-runner
  - codegen
  - mybatis
  - sql
  - database

environment:
  sdk: ^3.5.0

dependencies:
  analyzer: ">=6.0.0 <9.0.0"
  build: ">=2.4.0 <4.0.0"
  source_gen: ">=1.5.0 <3.0.0"
  xml: ^6.3.0

dev_dependencies:
  build_runner: ^2.4.0
  build_test: ">=2.2.0 <4.0.0"
  lints: ^5.0.0
  test: ^1.24.0
