name: flutter_mybatis
description: >-
  MyBatis-style XML-based SQL mapping library for Flutter/Dart.
  Separate SQL from code using XML files with dynamic SQL support.
version: 1.1.4

homepage: https://github.com/ryan-min/flutter_mybatis
repository: https://github.com/ryan-min/flutter_mybatis
issue_tracker: https://github.com/ryan-min/flutter_mybatis/issues

topics:
  - database
  - sql
  - orm
  - mybatis
  - sqlite

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Only the pure-Dart API. The concrete driver (sqflite, sqflite_common_ffi,
  # sqflite_common_ffi_web) is the application's choice, so this package stays
  # platform-neutral.
  sqflite_common: ^2.5.0
  xml: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.0

flutter:
