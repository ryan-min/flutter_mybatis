name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Library — analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Generator — analyze and test
        working-directory: generator
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Example (petstore) — generate, analyze, test, run
        working-directory: example/petstore
        run: |
          dart pub get
          dart run build_runner build --delete-conflicting-outputs
          dart analyze
          dart test
          dart run bin/petstore.dart

      - name: Example (flutter_app) — generate, analyze, test
        working-directory: example/flutter_app
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter analyze
          flutter test

      - name: Publish dry-run
        run: |
          flutter pub publish --dry-run
          cd generator && dart pub publish --dry-run
